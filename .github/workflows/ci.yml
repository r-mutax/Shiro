name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install g++-13
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13

      - name: Build
        run: make

      - name: Test
        run: make test
